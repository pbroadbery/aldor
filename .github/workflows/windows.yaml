name: Aldor CI

on: [push, pull_request,workflow_dispatch]

jobs:
  build-windows:
    runs-on: windows-2019
    timeout-minutes: 30

    steps:
    - name: Setup tmate session
      uses: mxschmitt/action-tmate@v3
      with:
        limit-access-to-actor: true
        detached: true

    - name: Linefeeds
      run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
    - uses: actions/checkout@v2
    - uses: msys2/setup-msys2@v2
      with:
        install: make mingw-w64-x86_64-gcc mingw-w64-x86_64-gmp gmp-devel zip autotools libtool flex bison gmp-devel libgc libgc-devel
    - name: Configure and Make
      run: |
        cd aldor && autogen.sh && cd ..
        mkdir ../build && cd ../build
        ../aldor/aldor/configure --prefix $(realpath ..)/opt --with-boehm-gc
        make -j4 --output-sync

